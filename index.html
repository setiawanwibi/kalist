<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="KALIST - plan your day, track your tasks, save what you watch." />
    <link rel="icon" type="image/svg+xml" href="/kalist-mark.svg" />
    <title>KALIST | Plan your day</title>
    <script>
      try {
        const savedTheme = JSON.parse(localStorage.getItem('kalist:theme') || 'null')
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
